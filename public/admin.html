<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ادمین | Bubu Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Bubu<span>Admin</span></a>
      <a class="btn btn-outline" href="index.html">مشاهده فروشگاه</a>
    </div>
  </header>

  <main class="page">
    <div id="adminLogin" class="auth-box" style="margin:0 auto">
      <form class="form" onsubmit="adminLogin(event)">
        <h2 class="center">ورود پنل ادمین</h2>
        <input id="adminTokenInput" type="password" placeholder="ADMIN_TOKEN" required>
        <button class="btn btn-primary btn-block" type="submit">ورود</button>
        <div class="msg" id="adminLoginMsg"></div>
      </form>
    </div>

    <div id="adminApp" style="display:none">
      <div class="admin-layout">
        <aside class="side">
          <button class="active" onclick="showSection('products', this)">محصولات</button>
          <button onclick="showSection('orders', this)">سفارش‌ها</button>
          <button onclick="showSection('users', this)">کاربران</button>
          <button onclick="adminLogout()">خروج</button>
        </aside>

        <section class="admin-grid">
          <div id="sec-products">
            <div class="panel-card">
              <form class="form" onsubmit="saveProduct(event)">
                <h2>افزودن / ویرایش محصول</h2>
                <input type="hidden" id="pId">
                <input id="pName" placeholder="نام محصول" required>
                <textarea id="pDesc" rows="2" placeholder="توضیحات"></textarea>
                <input id="pPrice" type="number" placeholder="قیمت" required>
                <input id="pImage" placeholder="لینک عکس (یا /images/...)">
                <select id="pCategory">
                  <option>تیشرت</option>
                  <option>کراپ‌تاپ</option>
                  <option>ست</option>
                  <option>شلوار</option>
                  <option>کت</option>
                  <option>کفش</option>
                  <option>اکسسوری</option>
                </select>
                <select id="pStyle">
                  <option>معمولی</option>
                  <option>کراپ</option>
                  <option>اورسایز</option>
                  <option>ست</option>
                </select>
                <input id="pColors" placeholder="رنگ‌ها با ویرگول: مشکی,سفید,کرم">
                <label><input type="checkbox" id="pFreeSize" checked onchange="toggleSizes()"> فری‌سایز</label>
                <input id="pSizes" placeholder="سایزها با ویرگول: S,M,L,XL" style="display:none">
                <input id="pStock" type="number" placeholder="موجودی" value="20">
                <button class="btn btn-primary btn-block" type="submit">ذخیره محصول</button>
                <div class="msg" id="pMsg"></div>
              </form>
            </div>
            <div class="panel-card" style="padding:16px;margin-top:16px">
              <h2 style="margin-bottom:12px">لیست محصولات</h2>
              <div id="adminProducts"></div>
            </div>
          </div>

          <div id="sec-orders" style="display:none">
            <div class="panel-card" style="padding:16px">
              <h2 style="margin-bottom:12px">سفارش‌ها</h2>
              <div id="adminOrders"></div>
            </div>
          </div>

          <div id="sec-users" style="display:none">
            <div class="panel-card" style="padding:16px">
              <h2 style="margin-bottom:12px">کاربران ثبت‌نام‌شده</h2>
              <div id="adminUsers"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="admin-page.js"></script>
</body>
</html>
